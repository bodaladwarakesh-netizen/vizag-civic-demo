      - name: Build the APK
        working-directory: project
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../VizagCivicDemo.apk

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: VizagCivicDemo
          path: VizagCivicDemo.apk

      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: Vizag Civic Demo – build ${{ github.run_number }}
          body: |
            Concept demo only. Not the official GVMC app. All data is fake.
            Download VizagCivicDemo.apk below and open it on an Android phone.
          files: VizagCivicDemo.apk
          make_latest: true
